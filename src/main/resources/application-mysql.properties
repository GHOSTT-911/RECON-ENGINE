# ===============================================================
# Optional MySQL profile. Run with:  run-mysql.bat
# or: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Credentials come from environment variables (never hard-code them):
#   DB_HOST (default localhost), DB_PORT (3306), DB_NAME (reconengine),
#   DB_USERNAME (root), DB_PASSWORD
# ===============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reconengine}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.h2.console.enabled=false
