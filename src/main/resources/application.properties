# ===============================================================
# ReconEngine - default configuration (embedded H2, zero setup)
# ===============================================================
spring.application.name=reconengine
server.port=${PORT:8081}

# Embedded file database stored in your user folder (outside OneDrive,
# so OneDrive sync never locks it). Data survives restarts.
spring.datasource.url=jdbc:h2:file:${user.home}/reconengine-data/reconengine;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Browse the database at http://localhost:8081/h2-console
# (JDBC URL shown above, user "sa", empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CSV uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Business rules
recon.mdr-rate=0.02
recon.mdr-tolerance=0.05
recon.seed-sample-data=true

logging.level.com.reconengine=INFO
